<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>नानौता सादात — फैमिली ट्री</title>
<script src="https://cdn.balkan.app/orgchart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6fa;
    color: #1e293b;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #0f172a);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.3px; }
  header small { display: block; font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

  .search-box {
    display: flex;
    gap: 8px;
  }
  .search-box input {
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    width: 220px;
    outline: none;
  }
  .search-box button {
    padding: 9px 16px;
    background: #f59e0b;
    color: #1e293b;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .search-box button:hover { background: #fbbf24; }

  #tree {
    width: 100%;
    height: calc(100vh - 78px);
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
    font-size: 1.05rem;
  }

  .error-box {
    max-width: 600px;
    margin: 80px auto;
    padding: 30px;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    color: #991b1b;
    text-align: center;
    line-height: 1.6;
  }
  .error-box strong { display: block; margin-bottom: 8px; font-size: 1.1rem; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🌳 नानौता सादात — फैमिली ट्री</h1>
    <small>सैयद नसीरुद्दीन मीर मुंशी की औलाद</small>
  </div>
  <div class="search-box">
    <input type="text" id="searchName" placeholder="नाम से खोजें..."
           onkeydown="if(event.key==='Enter') searchTree()">
    <button onclick="searchTree()">🔍 खोजें</button>
  </div>
</header>

<div id="tree">
  <div class="loading">⏳ डेटा लोड हो रहा है... कृपया प्रतीक्षा करें।</div>
</div>

<script>
  let chart;
  let treeNodes = [];

  // ---------- 1. family.json से डेटा लोड करें ----------
  fetch('family.json')
    .then(response => {
      if (!response.ok) throw new Error("family.json load nahi hui (" + response.status + ")");
      return response.json();
    })
    .then(json => {

      // phpMyAdmin JSON wrapper में असली table data खोजें
      let people = [];

      if (Array.isArray(json)) {
        const tableObject = json.find(
          item => item && item.type === "table" && Array.isArray(item.data)
        );
        if (tableObject) {
          people = tableObject.data;
        } else if (json.length && json[0].id) {
          // अगर सीधा array of records है
          people = json;
        }
      }

      if (!people.length) {
        throw new Error("JSON में people का डेटा नहीं मिला");
      }

      console.log("कुल records:", people.length);

      // ---------- 2. फॉर्मेट करें ----------
      treeNodes = people
        .filter(person =>
          person &&
          String(person.is_deleted) === "0" &&
          person.full_name &&
          person.full_name.trim() !== ""
        )
        .map(person => ({
          id: String(person.id),
          pid: person.father_id && person.father_id !== "0"
                ? String(person.father_id)
                : null,
          name: person.full_name,
          title: "Gen " + (person.generation_number || "?"),
          img: person.image_url && person.image_url.trim() !== ""
            ? person.image_url
            : "https://ui-avatars.com/api/?name=" +
              encodeURIComponent(person.full_name) +
              "&background=1e3a8a&color=fff&bold=true"
        }));

      console.log("ट्री में nodes:", treeNodes.length);

      // ---------- 3. ट्री इनिशियलाइज़ ----------
      document.getElementById("tree").innerHTML = "";

      chart = new OrgChart(document.getElementById("tree"), {
        nodes: treeNodes,
        nodeBinding: {
          field_0: "name",
          field_1: "title",
          img_0: "img"
        },
        layout: OrgChart.mixed,
        scaleInitial: OrgChart.match.boundary,
        enableSearch: false,
        mouseScrool: OrgChart.action.zoom,
        nodeMouseClick: OrgChart.action.none
      });

    })
    .catch(error => {
      console.error("Error loading JSON:", error);
      document.getElementById("tree").innerHTML =
        "<div class='error-box'>" +
        "<strong>⚠️ डेटा लोड नहीं हो पाया</strong>" +
        "कारण: " + error.message + "<br><br>" +
        "कृपया जाँचें:<br>" +
        "1. <b>family.json</b> फाइल उसी folder में रखी है जहाँ <b>family.html</b> है।<br>" +
        "2. फाइल का नाम ठीक <b>family.json</b> है (case-sensitive)।<br>" +
        "3. GitHub पर दोनों फाइलें upload हो चुकी हैं।" +
        "</div>";
    });

  // ---------- 4. सर्च फंक्शन ----------
  function searchTree() {
    const input = document.getElementById('searchName').value.trim().toLowerCase();

    if (!chart || !input) return;

    const foundNodes = treeNodes.filter(
      n => n.name && n.name.toLowerCase().includes(input)
    );

    if (foundNodes.length > 0) {
      chart.center(foundNodes[0].id);
    } else {
      alert("यह नाम ट्री में नहीं मिला!\n\nखोजा गया: " + input);
    }
  }
</script>

</body>
</html>
