  .search-area button { background: var(--primary); color: white; border: none; padding: 0 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

<!-- हेडर (JAS स्टाइल) -->
<div class="top-bar">
  <div class="container">
    <a href="?lang=ur">اردو</a>

  </div>
</div>
<header class="main-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Mokib <span>313</span></a>

      <input type="text" placeholder="Search...">
      <button>🔍</button>

    <div class="header-icons">
      <a href="https://mokib313.com/donate/" class="btn-donate-top">Donate Now</a>

  </div>
</nav>

<!-- मुख्य सेक्शन -->
<section class="container" style="padding-top: 40px;">
  <div style="text-align:center;">
    <h1 style="color:var(--primary); font-size:36px; margin-bottom:10px;">Nanauta Sadat Family Tree</h1>
    <p style="color:var(--ink-soft); margin-bottom:20px;">तारीख़ हज़रत आदम (अ.स.) से</p>
  </div>

  <!-- सर्च बार -->
  <div class="search-area">
    <input type="text" id="searchName" placeholder="नाम सर्च करें (जैसे: Haider, Ali, Fatima)...">
    <button onclick="searchTree()">Search</button>
  </div>

  <!-- ट्री यहाँ बनेगी -->
  <div class="tree-container" id="tree"></div>
</section>

<!-- फूटर (JAS स्टाइल) -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:none;">
      <p>© 2021–2026 Mokib 313. All rights reserved.</p>
    </div>
  </div>
</footer>

<script>
  let chart;

  // 1. family.json से डेटा लोड करें
  fetch('family.json')
    .then(response => response.json())
    .then(data => {
      
      // Family Chart के लिए डेटा फॉर्मेट करें
      // (इस लाइब्रेरी में डेटा को एक खास तरीके से देना होता है)
      let formattedData = data
        .filter(person => person.is_deleted == 0 && person.full_name) // डिलीट हुए और खाली नाम वाले लोगों को हटाएँ
        .map(person => ({
          id: String(person.id),
          data: {
            "name": person.full_name,
            "gender": (person.gender || "").toLowerCase() === 'female' ? 'F' : 'M',
            "birthYear": person.birth_year || "",
            "avatar": person.image_url || "https://ui-avatars.com/api/?name=" + encodeURIComponent(person.full_name) + "&background=1e3a8a&color=fff"
          },
          rels: {
            parents: person.father_id ? [String(person.father_id)] : [],
            children: [] // चिल्ड्रन को बाद में भरा जाएगा
          }
        }));

      // चिल्ड्रन को भरें (हर व्यक्ति के लिए, यह देखें कि कौन उसका बच्चा है)
      formattedData.forEach(person => {
        let childrenIds = data
          .filter(p => p.father_id == person.id && p.is_deleted == 0)
          .map(p => String(p.id));
        person.rels.children = childrenIds;
      });

      // 2. ट्री इनिशियलाइज़ करें
      chart = f3.createChart('#tree', formattedData)
        .setTransitionTime(1000)
        .setCardXSpacing(250)
        .setCardYSpacing(150)
        .setOrientation('vertical'); // 'vertical' या 'horizontal'

      // कार्ड्स को कस्टमाइज़ करें (नाम और फोटो दिखाने के लिए)
      chart.setCardHtml()
        .setCardDisplay([["name"], ["birthYear"]])
        .setCardDim({ "width": 200, "height": 100 })
        .setCardImageField("avatar");

      // ट्री को रेंडर करें
      chart.updateTree({ initial: true });

    })
    .catch(error => {
      console.error("Error loading JSON:", error);
      document.getElementById("tree").innerHTML = "<p style='text-align:center; padding:50px;'>डेटा लोड नहीं हो पाया। कृपया family.json फाइल चेक करें।</p>";
    });

  // 3. सर्च फंक्शन
  function searchTree() {
    let input = document.getElementById('searchName').value.toLowerCase();
    if(!chart || input === "") return;
    
    // Family Chart में सर्च फंक्शन (अगर उपलब्ध हो)
    // फिलहाल के लिए, हम ट्री को रीसेट कर सकते हैं या एक अलर्ट दिखा सकते हैं
    alert("सर्च फंक्शन फिलहाल के लिए उपलब्ध नहीं है, कृपया ट्री को मैन्युअली एक्सप्लोर करें।");
  }
</script>

</body>
</html>
