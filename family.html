<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineage | Nanauta Sadat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  .lineage-container {
    max-width: 780px; margin: 40px auto; background: white;
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    border: 1px solid var(--border); padding: 40px 25px;
  }
  .lineage-title { text-align: center; color: var(--primary); font-size: 30px; margin-bottom: 10px; font-weight: 800; }
  .lineage-sub { text-align: center; color: var(--ink-soft); margin-bottom: 30px; font-size: 15px; }

  .search-wrap { position: sticky; top: 10px; z-index: 20; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; border: 1px solid var(--border); }
  .search-wrap input {
    width: 100%; box-sizing: border-box; padding: 14px 18px; font-size: 16px;
    border: 2px solid var(--border); border-radius: 10px; outline: none;
    font-family: inherit; transition: 0.2s;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,58,138,0.1); }
  .search-info { font-size: 13px; color: var(--ink-soft); margin-top: 8px; min-height: 18px; }
  .search-info.err { color: #b91c1c; font-weight: 600; }
  .search-info.ok { color: #15803d; font-weight: 600; }

  .tree-list { list-style: none; padding: 0; margin: 0; position: relative; }
  .tree-list::before {
    content: ""; position: absolute; left: 26px; top: 27px; bottom: 27px;
    width: 3px; background: #c7d2fe; border-radius: 2px;
  }
  .tree-item { position: relative; padding-left: 70px; padding-bottom: 22px; transition: opacity 0.25s; }
  .tree-item:last-child { padding-bottom: 0; }

  .tree-dot {
    position: absolute; left: 8px; top: 8px; width: 38px; height: 38px; border-radius: 50%;
    background: white; border: 3px solid var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--primary);
    z-index: 2; transition: 0.2s;
  }
  .tree-card {
    background: var(--bg-soft); padding: 16px 20px; border-radius: 10px;
    border: 1px solid var(--border); transition: 0.2s;
  }
  .tree-card:hover { border-color: var(--primary); box-shadow: 0 4px 15px rgba(30,58,138,0.08); }
  .tree-name { font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .tree-urdu { font-size: 15px; color: var(--ink-soft); direction: rtl; margin-top: 4px; line-height: 1.8; }
  .tree-gen {
    display: inline-block; margin-top: 8px;
    background: var(--accent-soft); color: var(--primary);
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .tree-item.highlight .tree-card { background: #fef9c3; border-color: #ca8a04; box-shadow: 0 4px 22px rgba(202,138,4,0.3); }
  .tree-item.highlight .tree-dot { background: #fde047; border-color: #ca8a04; color: #713f12; }
  .tree-item.dim { opacity: 0.3; }
  .tree-item.highlight { opacity: 1; }

  .loading { text-align: center; padding: 40px; color: var(--ink-soft); list-style: none; }
  .error-box { text-align: center; padding: 25px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; color: #b91c1c; list-style: none; }
</style>
</head>
<body>

<div class="top-bar"><div class="container"><a href="?lang=ur">اردو</a><a href="contact.html">Contact Us</a></div></div>
<header class="main-header"><div class="container header-inner"><a href="index.html" class="logo">Mokib <span>313</span></a><div class="search-bar"><input type="text" placeholder="Search..."><button>🔍</button></div><div class="header-icons"><a href="https://mokib313.com/donate/" class="btn-donate-top">Donate Now</a></div></div></header>
<nav class="main-nav-bar"><div class="container nav-inner"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="intro.html">Introduction</a><a href="volunteer.html">Volunteers</a><a href="contact.html">Contact</a><a href="family.html" class="active">Family Lineage</a></nav>

<section class="container">
  <div class="lineage-container">
    <h1 class="lineage-title">Nanauta Sadat Lineage</h1>
    <p class="lineage-sub" id="lineageSub">Hazrat Ali (A.S.) → Syed Sardar Ghazi</p>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="नाम खोजें / Search name…" autocomplete="off">
      <div class="search-info" id="searchInfo"></div>
    </div>

    <ul class="tree-list" id="treeList">
      <li class="loading">डेटा लोड हो रहा है…</li>
    </ul>
  </div>
</section>

<footer class="site-footer"><div class="container"><div class="footer-bottom" style="border:none;"><p>© 2021–2026 Mokib 313. All rights reserved.</p></div></div></footer>

<script>
/* === Constants === */
const ROOT_ID   = '376';   // Hazrat Ali (A.S.)
const TARGET_ID = '243';   // Syed Sardar Ghazi

/* === Helpers === */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function splitName(full) {
  if (!full) return { en: '', ur: '' };
  const m = String(full).match(/^(.*?)\s*[—–]\s*(.+)$/);
  if (m) return { en: m[1].trim(), ur: m[2].trim() };
  return { en: String(full).trim(), ur: '' };
}

/* phpMyAdmin / wrapper JSON को unwrap करें */
function extractPeople(raw) {
  let d = raw;
  if (d && d.family_json) d = typeof d.family_json === 'string' ? JSON.parse(d.family_json) : d.family_json;
  if (Array.isArray(d) && d.length === 1 && d[0] && d[0].family_json) {
    d = typeof d[0].family_json === 'string' ? JSON.parse(d[0].family_json) : d[0].family_json;
  }
  if (Array.isArray(d)) {
    const t = d.find(x => x && x.type === 'table' && Array.isArray(x.data));
    if (t) d = t.data;
  }
  if (d && Array.isArray(d.data)) d = d.data;
  if (!Array.isArray(d)) throw new Error("Persons array नहीं मिला");
  return d.filter(p => p && (p.full_name || p.name));
}

/* === Main chain बनाएँ: Sardar Ghazi → Hazrat Ali (exactly 44) === */
let BY_ID = {};
function buildMainChain() {
  const target = BY_ID[TARGET_ID];
  if (!target) throw new Error("Sardar Ghazi (id 243) database में नहीं मिला");

  /* Method 1 — lineage_path सबसे reliable */
  if (target.lineage_path) {
    const ids = String(target.lineage_path).split('/');
    const startIdx = ids.indexOf(ROOT_ID);
    if (startIdx >= 0) {
      return ids.slice(startIdx).map(id => BY_ID[id]).filter(Boolean);
    }
  }

  /* Method 2 — father_id walk करके Hazrat Ali पर रुकें */
  const chain = [];
  let cur = target;
  const seen = new Set();
  while (cur && !seen.has(String(cur.id))) {
    seen.add(String(cur.id));
    chain.push(cur);
    if (String(cur.id) === ROOT_ID) break;
    cur = cur.father_id != null ? BY_ID[String(cur.father_id)] : null;
  }
  return chain.reverse();
}

/* === Render — top: Hazrat Ali (gen 1), bottom: Sardar Ghazi (gen 44) === */
function renderTree(chain) {
  const list = document.getElementById('treeList');
  document.getElementById('lineageSub').textContent =
    `Hazrat Ali (A.S.) → Syed Sardar Ghazi · ${chain.length} Generations`;

  if (!chain.length) {
    list.innerHTML = "<li class='error-box'>Lineage chain खाली है।</li>";
    return;
  }

  list.innerHTML = chain.map((p, idx) => {
    const gen = idx + 1;
    const { en, ur } = splitName(p.full_name || '');
    return `
      <li class="tree-item" data-id="${escapeHtml(p.id)}">
        <div class="tree-dot">${gen}</div>
        <div class="tree-card">
          <div class="tree-name">${escapeHtml(en)}</div>
          ${ur ? `<div class="tree-urdu">${escapeHtml(ur)}</div>` : ''}
          <span class="tree-gen">Generation ${gen}</span>
        </div>
      </li>`;
  }).join('');
}

/* === Search — highlight + scroll === */
function doSearch(query) {
  const info = document.getElementById('searchInfo');
  const items = document.querySelectorAll('.tree-item');
  const q = query.trim().toLowerCase();

  if (!q) {
    items.forEach(it => it.classList.remove('highlight', 'dim'));
    info.textContent = '';
    info.className = 'search-info';
    return;
  }

  const matches = [];
  items.forEach(it => {
    const p = BY_ID[it.dataset.id];
    if (!p) return;
    const fields = [p.full_name, p.name, p.self_name, p.person_code]
      .filter(Boolean).map(f => String(f).toLowerCase());
    if (fields.some(f => f.includes(q))) {
      matches.push(it);
      it.classList.add('highlight');
      it.classList.remove('dim');
    } else {
      it.classList.add('dim');
      it.classList.remove('highlight');
    }
  });

  if (matches.length) {
    matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    info.textContent = `✓ ${matches.length} match — main lineage me mila`;
    info.className = 'search-info ok';
  } else {
    info.textContent = `✗ "${query}" — main lineage (Hazrat Ali → Sardar Ghazi) me nahi mila`;
    info.className = 'search-info err';
  }
}

document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(window._st);
  window._st = setTimeout(() => doSearch(e.target.value), 150);
});

/* === Load JSON === */
fetch('family.json', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error("family.json नहीं मिली (HTTP " + r.status + ")");
    return r.text();
  })
  .then(text => {
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { throw new Error("JSON invalid: " + e.message); }

    const people = extractPeople(raw);
    BY_ID = {};
    people.forEach(p => { BY_ID[String(p.id)] = p; });

    const chain = buildMainChain();
    if (chain.length !== 44) {
      console.warn("Chain length:", chain.length, "expected 44");
    }
    renderTree(chain);
  })
  .catch(err => {
    console.error(err);
    document.getElementById('treeList').innerHTML =
      `<li class="error-box">डेटा लोड नहीं हो पाया।<br><small>${escapeHtml(err.message)}</small></li>`;
  });
</script>

</body>
</html>
